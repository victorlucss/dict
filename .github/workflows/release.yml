name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Info.plist
        id: version
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check_tag.outputs.exists == 'false'
        run: swift test

      - name: Run script tests
        if: steps.check_tag.outputs.exists == 'false'
        run: bash tests/test-build.sh

      - name: Build DMG
        if: steps.check_tag.outputs.exists == 'false'
        run: ./scripts/build.sh --dmg

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            Dict.dmg \
            --title "Dict ${{ steps.version.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
