# TEMPORARY branch validation (delete before/after merge). Mirrors release.yml's
# build matrix but does NOT publish — proves the macOS-only-Parakeet split builds
# everywhere: macOS bundles the sherpa libs (Parakeet), Linux/Windows compile
# Whisper-only (no sherpa to bundle). Runs only on the feature branch.
name: MegaBrain xplat build check
on:
  push:
    branches: [feat/parakeet-stt]
  workflow_dispatch:

concurrency:
  group: xplat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev

      - name: Build (no publish)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}

      - name: macOS — confirm Parakeet libs bundled
        if: contains(matrix.platform, 'macos')
        shell: bash
        run: |
          APP="$(find src-tauri/target -type d -name 'MegaBrain.app' | head -1)"
          echo "App bundle: $APP"
          ls -lh "$APP/Contents/Frameworks/" || true
          for lib in libonnxruntime.1.17.1.dylib libsherpa-onnx-c-api.dylib; do
            test -f "$APP/Contents/Frameworks/$lib" || { echo "::error::$lib missing from bundle"; exit 1; }
          done
          echo "Both sherpa libs bundled."

      - name: Linux/Windows — confirm built (Whisper-only, no sherpa)
        if: ${{ !contains(matrix.platform, 'macos') }}
        shell: bash
        run: |
          echo "Build succeeded on ${{ matrix.platform }} without sherpa (Whisper-only)."
