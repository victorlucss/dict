<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaBrain Setup</title>
    <link rel="stylesheet" href="onboarding.css">
</head>
<body>
    <div class="wizard">
        <div class="wizard-progress" aria-hidden="true"><div class="wizard-progress-fill" id="wizardProgress"></div></div>
        <div class="wizard-step">
            <div class="wizard-icon" id="stepIcon" aria-hidden="true"></div>
            <h1 id="stepTitle"></h1>
            <p id="stepDescription"></p>

            <!-- Model picker (shown only on the model step) -->
            <div class="model-picker hidden" id="modelPicker">
                <div class="model-list" id="modelList"></div>
                <div class="model-action" id="modelAction"></div>
            </div>

            <!-- Resonate chips (shown only on the resonate step) -->
            <div class="resonate hidden" id="resonateBox"></div>

            <!-- Personalization (shown only on the personalize step) -->
            <div class="personalize hidden" id="personalizeBox"></div>

            <!-- Try-it result (shown only on the try-it step) -->
            <div class="tryit hidden" id="tryitBox">
                <div class="tryit-result" id="tryitResult" data-empty="true">Your words will land right here.</div>
            </div>
        </div>

        <div class="wizard-footer">
            <div class="wizard-actions">
                <button id="secondaryBtn" class="btn-text" style="display:none;"></button>
                <button id="primaryBtn" class="btn-primary"></button>
            </div>
            <div id="stepIndicator" class="step-indicator"></div>
        </div>
    </div>
    <script src="onboarding.js"></script>
</body>
</html>
