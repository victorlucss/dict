<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="fallback.css" />
</head>
<body>
    <div class="popup" id="popup" title="Click to copy">
        <div class="row">
            <span class="header" id="header">Couldn't paste. Click to copy</span>
            <!-- Circular countdown: the fill ring depletes over 5s; pauses on hover. -->
            <span class="timer" id="timer" aria-hidden="true">
                <svg viewBox="0 0 28 28" width="22" height="22">
                    <circle class="ring-track" cx="14" cy="14" r="11"></circle>
                    <circle class="ring-fill" id="ringFill" cx="14" cy="14" r="11"></circle>
                </svg>
                <span class="timer-icon" id="timerIcon">
                    <!-- copy glyph -->
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </span>
            </span>
        </div>
        <div class="text" id="text"></div>
    </div>
    <script src="fallback.js"></script>
</body>
</html>
