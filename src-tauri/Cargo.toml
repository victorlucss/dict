[package]
name = "dict"
version = "1.0.0"
description = "Voice to text via global hotkey — cross-platform"
edition = "2021"

[lib]
name = "dict_lib"
path = "src/lib.rs"

[[bin]]
name = "dict"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
rubato = "0.16"
# whisper.cpp embedded in-process: load the model once, keep it warm in RAM, and
# transcribe f32 samples directly (no subprocess, no disk WAV). Metal GPU added on
# macOS below.
whisper-rs = "0.16"
# Parakeet models ship as .tar.bz2 bundles (encoder/decoder/joiner .onnx + tokens);
# decompress + untar in-process when downloading them. Cross-platform (the model
# download UI is harmless to compile everywhere; Parakeet inference itself is
# macOS-only — see sherpa-rs under the macOS target deps below).
tar = "0.4"
bzip2 = "0.5"
arboard = { version = "3", default-features = false }
enigo = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSEvent", "NSColor", "block2"] }
block2 = "0.6"
window-vibrancy = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8"
# Metal GPU acceleration for whisper.cpp on Apple Silicon (CPU elsewhere).
whisper-rs = { version = "0.16", features = ["metal"] }
# Second STT engine (Parakeet / NeMo transducer) via sherpa-onnx. macOS-only for
# now: `download-binaries` ships sherpa-onnx + ONNX Runtime as dynamic libs that
# must be bundled per-platform, and only the macOS bundling is wired up + tested.
# Linux/Windows therefore ship Whisper-only (no sherpa libs to bundle/break).
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
